<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖剣の祭壇 - 幻想の森</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87ceeb; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-overlay { position: absolute; top: 0; right: 0; z-index: 10; padding: 1.5rem; pointer-events: none; }
        .interactive { pointer-events: auto; }
        #loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #87ceeb; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #2d3748; transition: opacity 0.8s ease; }
    </style>
    <!-- Three.js and Addons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
</head>
<body>

    <!-- ローディング画面 -->
    <div id="loader">
        <div class="text-2xl font-bold tracking-widest mb-3 text-emerald-800">MYSTICAL FOREST</div>
        <div class="w-48 h-1.5 bg-gray-300 rounded-full overflow-hidden">
            <div id="progress-bar" class="w-0 h-full bg-emerald-600 transition-all duration-200"></div>
        </div>
        <p id="loader-text" class="text-xs text-gray-600 mt-2 font-mono">Loading sanctuary... (0%)</p>
    </div>

    <!-- 3Dキャンバスコンテナ -->
    <div id="canvas-container"></div>

    <!-- 右上のミニマルなUI -->
    <div id="ui-overlay">
        <div class="interactive bg-white/30 backdrop-blur-md border border-white/50 px-4 py-3 rounded-xl shadow-lg text-slate-800 text-xs max-w-xs transition-all">
            <div class="flex items-center justify-between mb-1">
                <span class="font-bold text-emerald-900 tracking-wider" id="time-label">聖剣の祭壇</span>
                <button id="reset-btn" class="text-slate-600 hover:text-slate-900 text-[10px] underline cursor-pointer hidden">リセット</button>
            </div>
            <p id="status-text" class="text-slate-700 leading-relaxed">剣をクリックして、音声で願いを伝えてください。</p>
        </div>
    </div>

    <script>
        // 時間帯の判定 (朝: 5-10, 昼: 10-17, 夕方: 17-19, 夜: 19-5)
        const currentHour = new Date().getHours();
        let timeTheme = 'day';
        if (currentHour >= 5 && currentHour < 10) timeTheme = 'morning';
        else if (currentHour >= 10 && currentHour < 17) timeTheme = 'day';
        else if (currentHour >= 17 && currentHour < 19) timeTheme = 'evening';
        else timeTheme = 'night';

        const themes = {
            morning: { sky: 0xdceaf5, fog: 0xdceaf5, sunColor: 0xfff5e6, sunIntensity: 1.8, ambientColor: 0xdbeafe, ambientIntensity: 1.0, label: '朝の聖域' },
            day:     { sky: 0x72bcd5, fog: 0xa1d4e6, sunColor: 0xffffff, sunIntensity: 2.2, ambientColor: 0xe0f2fe, ambientIntensity: 1.2, label: '昼の聖域' },
            evening: { sky: 0xf49f71, fog: 0xdb8160, sunColor: 0xff7b00, sunIntensity: 1.6, ambientColor: 0xffedd5, ambientIntensity: 0.8, label: '夕暮れの聖域' },
            night:   { sky: 0x050b14, fog: 0x0a1628, sunColor: 0x8cb4ff, sunIntensity: 0.8, ambientColor: 0x0a1628, ambientIntensity: 0.5, label: '夜の聖域' }
        };
        const activeTheme = themes[timeTheme];
        document.getElementById('time-label').textContent = activeTheme.label;

        // シーン、カメラ、レンダラーの初期化
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(activeTheme.sky);
        scene.fog = new THREE.FogExp2(activeTheme.fog, 0.02);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
        controls.minDistance = 2;
        controls.maxDistance = 15;
        controls.target.set(0, 1.0, 0);

        // ポストプロセス（ブルーム効果で緑の発光を美しく表現）
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.4, 0.8);
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // ライティング
        const ambientLight = new THREE.AmbientLight(activeTheme.ambientColor, activeTheme.ambientIntensity);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(activeTheme.sunColor, activeTheme.sunIntensity);
        sunLight.position.set(25, 35, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // --- プロシージャルテクスチャの生成（地面・石） ---
        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = timeTheme === 'night' ? '#142618' : '#315c2d';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 25000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#3e7a38' : '#22401e';
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 5);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(15, 15);
            return texture;
        }

        function createStoneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#646f78';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 8000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#4b555e' : '#7d8790';
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 3, 3);
            }
            return new THREE.CanvasTexture(canvas);
        }

        const grassTex = createGrassTexture();
        const stoneTex = createStoneTexture();

        // 地面の作成
        const groundGeo = new THREE.PlaneGeometry(120, 120, 48, 48);
        const pos = groundGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            const vx = pos.getX(i);
            const vy = pos.getY(i);
            pos.setZ(i, Math.sin(vx * 0.08) * Math.cos(vy * 0.08) * 0.4);
        }
        groundGeo.computeVertexNormals();

        const groundMat = new THREE.MeshStandardMaterial({
            map: grassTex,
            roughness: 0.85,
            metalness: 0.05
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 中央の石の祭壇の作成
        const altarGroup = new THREE.Group();
        const rockMat = new THREE.MeshStandardMaterial({
            map: stoneTex,
            roughness: 0.7,
            metalness: 0.1
        });

        const rockGeo = new THREE.CylinderGeometry(1.1, 1.6, 0.9, 8);
        const rock = new THREE.Mesh(rockGeo, rockMat);
        rock.position.y = 0.45;
        rock.castShadow = true;
        rock.receiveShadow = true;
        altarGroup.add(rock);

        // 祭壇の周りに小さな石や草を生やす
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const smallRockGeo = new THREE.DodecahedronGeometry(0.2 + Math.random() * 0.2, 1);
            const smallRock = new THREE.Mesh(smallRockGeo, rockMat);
            smallRock.position.set(Math.cos(angle) * 1.3, 0.15, Math.sin(angle) * 1.3);
            smallRock.rotation.set(Math.random(), Math.random(), Math.random());
            smallRock.castShadow = true;
            altarGroup.add(smallRock);
        }
        scene.add(altarGroup);

        // 森の木々を生成
        function createTree() {
            const treeGroup = new THREE.Group();
            const trunkGeo = new THREE.CylinderGeometry(0.25, 0.5, 3.5, 6);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3b32, roughness: 0.9 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1.75;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            const leafMat = new THREE.MeshStandardMaterial({
                color: timeTheme === 'night' ? 0x153224 : 0x244a33,
                roughness: 0.75,
                metalness: 0.05
            });

            for (let i = 0; i < 3; i++) {
                const radius = 2.0 - i * 0.45;
                const coneGeo = new THREE.ConeGeometry(radius, 2.2, 5);
                const cone = new THREE.Mesh(coneGeo, leafMat);
                cone.position.y = 3.0 + i * 1.3;
                cone.castShadow = true;
                treeGroup.add(cone);
            }
            return treeGroup;
        }

        for (let i = 0; i < 60; i++) {
            const tree = createTree();
            const angle = Math.random() * Math.PI * 2;
            const radius = 4 + Math.random() * 40;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            if (radius < 3.5) continue;

            const scale = 0.7 + Math.random() * 0.9;
            tree.scale.set(scale, scale, scale);
            tree.position.set(x, 0, z);
            tree.rotation.y = Math.random() * Math.PI * 2;
            scene.add(tree);
        }

        // --- 複数の青い光球（妖精）の生成 ---
        const fairies = [];
        const fairyGeo = new THREE.SphereGeometry(0.08, 16, 16);
        const fairyMat = new THREE.MeshBasicMaterial({ color: 0x00f2ff });

        for (let i = 0; i < 6; i++) {
            const fairyGroup = new THREE.Group();
            const mesh = new THREE.Mesh(fairyGeo, fairyMat);
            fairyGroup.add(mesh);

            // 妖精ごとのポイントライト
            const fLight = new THREE.PointLight(0x00f2ff, 1.5, 3);
            fairyGroup.add(fLight);

            scene.add(fairyGroup);
            fairies.push({
                group: fairyGroup,
                angle: (i / 6) * Math.PI * 2,
                radius: 1.8 + Math.random() * 1.5,
                speed: 0.8 + Math.random() * 0.5,
                yOffset: 1.0 + Math.random() * 1.5
            });
        }

        // GLBモデル（剣: psword.glb）の読み込み
        let loadedSword = null;
        const manager = new THREE.LoadingManager();
        const progressBar = document.getElementById('progress-bar');
        const loaderText = document.getElementById('loader-text');
        const loaderScreen = document.getElementById('loader');

        manager.onProgress = function (url, itemsLoaded, itemsTotal) {
            const progress = (itemsLoaded / itemsTotal) * 100;
            progressBar.style.width = progress + '%';
            loaderText.textContent = `Loading sanctuary... (${Math.round(progress)}%)`;
        };

        manager.onLoad = function () {
            loaderScreen.style.opacity = '0';
            setTimeout(() => { loaderScreen.style.display = 'none'; }, 800);
        };

        const loader = new THREE.GLTFLoader(manager);
        loader.load('psword.glb', function (gltf) {
            loadedSword = gltf.scene;
            
            // 【要望対応】深く刺さりすぎず、先端が浅く垂直に真っ直ぐ刺さるように位置調整
            loadedSword.scale.set(2.0, 2.0, 2.0);
            loadedSword.position.set(0, 0.9, 0); // 祭壇の上面に合わせた浅い刺さり具合
            loadedSword.rotation.set(0, 0, 0); // 垂直真っ直ぐ固定・微動だにしない

            // 【要望対応】剣が暗くならないよう光度を上げ、エッジ・模様を緑色に発光させる
            loadedSword.traverse((node) => {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                    if (node.material) {
                        node.material.roughness = 0.2;
                        node.material.metalness = 0.9;
                        // 緑色のエッジ発光（emissive）を付与し、ブルーム効果で光らせる
                        node.material.emissive = new THREE.Color(0x00ff66);
                        node.material.emissiveIntensity = 0.5;
                    }
                }
            });

            scene.add(loadedSword);
        }, undefined, function (error) {
            console.error('An error happened while loading psword.glb:', error);
            loaderText.textContent = 'Error loading psword.glb. Check file path.';
            progressBar.style.backgroundColor = '#ef4444';
        });

        // --- 音声認識 & 音声合成インタラクション ---
        let hasWish = false;
        let currentWish = "";
        let isListening = false;

        const statusText = document.getElementById('status-text');
        const resetBtn = document.getElementById('reset-btn');

        function updateUI(message, showReset = false) {
            statusText.textContent = message;
            if (showReset) resetBtn.classList.remove('hidden');
            else resetBtn.classList.add('hidden');
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = (event) => {
                currentWish = event.results[0][0].transcript;
                hasWish = true;
                isListening = false;
                updateUI(`願いが宿りました: 「${currentWish}」 (再び剣に触れると聴けます)`, true);
            };
            recognition.onerror = () => { isListening = false; updateUI('聞き取れませんでした。もう一度剣をクリックしてください。'); };
            recognition.onend = () => { isListening = false; };
        }

        function speakWish(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(`今日の願い事は、「${text}」だな。しかと聞き届けた。`);
                utterance.lang = 'ja-JP';
                utterance.pitch = 0.55; // ダンディな低い男の声
                utterance.rate = 0.92;

                const voices = window.speechSynthesis.getVoices();
                const maleVoice = voices.find(v => v.lang.includes('ja') && (v.name.includes('Male') || v.name.includes('男') || v.name.includes('Google 日本語')));
                if (maleVoice) utterance.voice = maleVoice;

                utterance.onstart = () => updateUI('聖剣が静かに語りかけています...');
                utterance.onend = () => updateUI(`今日の願い: 「${currentWish}」 (再度クリックで再読込)`, true);
                window.speechSynthesis.speak(utterance);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // クリック判定
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.closest('#ui-overlay')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            let hitSword = false;
            if (loadedSword) {
                const intersects = raycaster.intersectObject(loadedSword, true);
                if (intersects.length > 0) hitSword = true;
            }

            if (hitSword || raycaster.intersectObject(altarGroup, true).length > 0) {
                if (!hasWish) {
                    if (recognition && !isListening) {
                        try {
                            isListening = true;
                            updateUI('お聴きしています... 願いを声に出して話してください。');
                            recognition.start();
                        } catch (e) {
                            isListening = false;
                        }
                    } else if (!recognition) {
                        const manualWish = prompt("【聖剣の試練】願い事を入力してください:");
                        if (manualWish) {
                            currentWish = manualWish;
                            hasWish = true;
                            updateUI(`願いが宿りました: 「${currentWish}」`, true);
                        }
                    }
                } else {
                    speakWish(currentWish);
                }
            }
        });

        resetBtn.addEventListener('click', () => {
            hasWish = false;
            currentWish = "";
            updateUI('願いがリセットされました。再び剣をクリックして新しい願いをどうぞ。');
        });

        // アニメーションループ
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // 妖精（青い光球）をふわふわと周回させるアニメーション
            fairies.forEach((fairy, index) => {
                fairy.angle += fairy.speed * 0.01;
                const x = Math.cos(fairy.angle) * fairy.radius;
                const z = Math.sin(fairy.angle) * fairy.radius;
                const y = fairy.yOffset + Math.sin(elapsedTime * 2 + index) * 0.2;
                fairy.group.position.set(x, y, z);
            });

            controls.update();
            composer.render();
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
